<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>I Love You 💕</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#ffd3e4,#fff5f9);
}
.card{width:min(92vw,560px);text-align:center;position:relative;z-index:2}
.question{
  background:#ff8fba;color:#fff;border-radius:24px;padding:28px 20px;
  font-size:clamp(25px,7vw,38px);font-weight:800;
  box-shadow:0 12px 30px #d45a8738;margin-bottom:25px;
}
.stage{position:relative;height:190px;width:100%}
button{
  appearance:none;border:0;border-radius:999px;padding:17px 23px;
  font-size:18px;font-weight:750;box-shadow:0 8px 20px #8d426328;
  touch-action:none;user-select:none;position:absolute;
}
#yes{background:#ff4f91;color:#fff;left:50%;top:0;transform:translateX(-50%)}
#no{background:#fff;color:#e84b86;left:50%;top:82px;transform:translateX(-50%);transition:left .13s ease,top .13s ease}
#answer{min-height:45px;color:#d92f72;font-size:23px;font-weight:800}
.float{position:fixed;bottom:-40px;pointer-events:none;animation:up 7s linear infinite;opacity:.5;font-size:24px}
@keyframes up{15%{opacity:.5}to{transform:translateY(-115vh) rotate(20deg);opacity:0}}
.pop{position:fixed;z-index:20;pointer-events:none;font-size:30px;animation:pop .7s ease forwards}
@keyframes pop{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6) translateY(-70px);opacity:0}}
</style>
</head>
<body>
<div class="float" style="left:8%;animation-delay:0s">💕</div>
<div class="float" style="left:25%;animation-delay:2s">💗</div>
<div class="float" style="left:47%;animation-delay:4s">❤️</div>
<div class="float" style="left:70%;animation-delay:1s">💖</div>
<div class="float" style="left:87%;animation-delay:3s">💕</div>

<div class="card">
  <div class="question">I love you, do you love me back? 💗</div>
  <div class="stage" id="stage">
    <button id="yes">Yes, I love you too 💕</button>
    <button id="no">No I don't 😭</button>
  </div>
  <div id="answer"></div>
</div>

<script>
(function(){
  const no=document.getElementById('no'), yes=document.getElementById('yes');
  const stage=document.getElementById('stage'), answer=document.getElementById('answer');

  function pop(x,y,emoji){
    const p=document.createElement('div'); p.className='pop'; p.textContent=emoji;
    p.style.left=(x-15)+'px'; p.style.top=(y-15)+'px'; document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
  }

  function dodge(e){
    if(e) e.preventDefault();
    const r=stage.getBoundingClientRect();
    const b=no.getBoundingClientRect();
    const pad=5;
    const maxX=Math.max(pad,r.width-b.width-pad);
    const maxY=Math.max(pad,r.height-b.height-pad);
    let x=pad+Math.random()*Math.max(1,maxX-pad);
    let y=pad+Math.random()*Math.max(1,maxY-pad);

    // Don't place it directly over the Yes button.
    if(y<65) y=Math.min(maxY,90);
    no.style.left=x+'px'; no.style.top=y+'px'; no.style.transform='none';

    const cx=e && e.clientX!=null?e.clientX:r.left+r.width/2;
    const cy=e && e.clientY!=null?e.clientY:r.top+r.height/2;
    pop(cx,cy,'💥');
  }

  // pointerdown catches iPhone/iPad touch AND mouse before a click can happen.
  no.addEventListener('pointerdown',dodge,{passive:false});
  no.addEventListener('touchstart',dodge,{passive:false});
  no.addEventListener('mouseenter',dodge);

  yes.addEventListener('click',function(){
    answer.textContent='I knew it!!! ❤️🥰';
    yes.textContent='YAY!!! 💕';
    for(let i=0;i<18;i++){
      setTimeout(()=>{
        const x=Math.random()*innerWidth, y=innerHeight*.4+Math.random()*150;
        pop(x,y,['❤️','💕','💖','💗','🥰'][Math.floor(Math.random()*5)]);
      },i*45);
    }
  });
})();
</script>
</body>
</html>
