<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quick Question 💚</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(circle at center, #145a2a 0%, #08351a 45%, #03150a 100%);

      display: flex;
      justify-content: center;
      align-items: center;

      color: #d8ffd9;
      font-family: "Metal Mania", cursive;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle, rgba(50,255,90,0.12) 1px, transparent 1px);

      background-size: 35px 35px;
      animation: backgroundMove 8s linear infinite;
      pointer-events: none;
    }

    @keyframes backgroundMove {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(35px, 35px);
      }
    }

    /* BLACK FLOATING BLOBS */

    .blob {
      position: absolute;
      background: #010201;
      border-radius: 50%;

      opacity: 0.85;

      box-shadow:
        0 0 20px rgba(0,0,0,0.8),
        inset 5px 5px 15px rgba(40,80,45,0.15);

      animation: float 9s infinite ease-in-out;

      z-index: 1;
    }

    .blob:nth-child(1) {
      width: 100px;
      height: 100px;
      left: 5%;
      top: 12%;
      animation-duration: 8s;
    }

    .blob:nth-child(2) {
      width: 55px;
      height: 55px;
      right: 12%;
      top: 18%;
      animation-duration: 10s;
    }

    .blob:nth-child(3) {
      width: 140px;
      height: 140px;
      right: 2%;
      bottom: 5%;
      animation-duration: 12s;
    }

    .blob:nth-child(4) {
      width: 70px;
      height: 70px;
      left: 12%;
      bottom: 15%;
      animation-duration: 7s;
    }

    .blob:nth-child(5) {
      width: 45px;
      height: 45px;
      left: 48%;
      top: 7%;
      animation-duration: 6s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }

      50% {
        transform: translate(30px, -35px) rotate(180deg);
      }
    }

    /* GREEN SPARKS */

    .spark {
      position: absolute;

      width: 4px;
      height: 4px;

      background: #7cff8b;
      border-radius: 50%;

      box-shadow:
        0 0 8px #7cff8b,
        0 0 18px #24ff4b,
        0 0 30px #00b52b;

      animation: sparkle 2s infinite ease-in-out;

      z-index: 2;
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.1;
        transform: scale(0.4);
      }

      50% {
        opacity: 1;
        transform: scale(1.7);
      }
    }

    /* MAIN BOX */

    .container {
      position: relative;
      z-index: 10;

      width: 90%;
      max-width: 700px;

      text-align: center;

      padding: 50px 25px;

      background: rgba(0, 10, 3, 0.55);

      border: 2px solid rgba(100,255,120,0.25);

      border-radius: 18px;

      backdrop-filter: blur(7px);

      box-shadow:
        0 0 30px rgba(0,0,0,0.7),
        0 0 50px rgba(0,255,60,0.08);
    }

    /* QUESTION */

    h1 {
      font-family: "Metal Mania", cursive;

      font-size: clamp(35px, 8vw, 65px);

      line-height: 1.05;

      margin: 0 0 45px;

      color: #e7ffe8;

      letter-spacing: 2px;

      text-shadow:
        3px 3px 0 #000,
        0 0 10px #35ff52,
        0 0 25px rgba(30,255,60,0.45);
    }

    /* BUTTONS */

    .buttons {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 20px;

      flex-wrap: wrap;
    }

    button {
      font-family: "Metal Mania", cursive;

      border: none;

      padding: 17px 30px;

      font-size: 22px;

      letter-spacing: 1px;

      border-radius: 10px;

      cursor: pointer;

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    /* YES */

    #yes {
      background: #55e66b;

      color: #032009;

      box-shadow:
        0 6px 0 #145b20,
        0 0 20px rgba(80,255,100,0.35);
    }

    #yes:hover {
      transform: translateY(-4px) scale(1.06);

      box-shadow:
        0 10px 0 #145b20,
        0 0 30px rgba(80,255,100,0.6);
    }

    /* NO */

    #no {
      background: #020302;

      color: #eaffeb;

      border: 1px solid #173d1c;

      box-shadow:
        0 6px 0 #000,
        0 0 15px rgba(0,0,0,0.8);
    }

    #no:hover {
      transform: scale(1.05);
    }

    /* YES SCREEN */

    .answer {
      display: none;

      font-family: "Metal Mania", cursive;

      font-size: clamp(38px, 8vw, 65px);

      line-height: 1.1;

      color: #e7ffe8;

      text-shadow:
        3px 3px 0 #000,
        0 0 15px #38ff55,
        0 0 30px rgba(40,255,70,0.5);
    }

    .answer.show {
      display: block;
    }

    .question.hide {
      display: none;
    }
  </style>
</head>

<body>

  <!-- MUSIC -->

  <audio id="music" loop>
    <source src="./background.m4a" type="audio/mp4">
  </audio>


  <!-- BLACK BLOBS -->

  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>


  <!-- GREEN SPARKS -->

  <div class="spark" style="left:5%; top:30%; animation-delay:.2s;"></div>
  <div class="spark" style="left:18%; top:70%; animation-delay:1s;"></div>
  <div class="spark" style="left:30%; top:12%; animation-delay:.5s;"></div>
  <div class="spark" style="left:42%; top:85%; animation-delay:1.5s;"></div>
  <div class="spark" style="left:55%; top:25%; animation-delay:.8s;"></div>
  <div class="spark" style="left:68%; top:65%; animation-delay:.3s;"></div>
  <div class="spark" style="left:78%; top:10%; animation-delay:1.2s;"></div>
  <div class="spark" style="left:90%; top:45%; animation-delay:.7s;"></div>
  <div class="spark" style="left:12%; top:50%; animation-delay:1.8s;"></div>
  <div class="spark" style="left:85%; top:80%; animation-delay:.4s;"></div>


  <!-- MAIN CONTENT -->

  <div class="container">

    <div id="question" class="question">

      <h1>
        Will you watch Avengers Doomsday with me?
      </h1>

      <div class="buttons">

        <button id="yes">
          Yes I will!! 💚
        </button>

        <button id="no">
          No I won’t
        </button>

      </div>

    </div>


    <div id="answer" class="answer">

      YAY!! 💚😎

      <br><br>

      Avengers Doomsday it is!!

    </div>

  </div>


  <script>

    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");

    const question = document.getElementById("question");
    const answer = document.getElementById("answer");

    const music = document.getElementById("music");


    /* YES BUTTON */

    yesButton.addEventListener("click", function() {

      // Start the music when the user directly taps Yes
      music.play().catch(function(error) {
        console.log("Music could not play:", error);
      });

      // Show the YES screen
      question.classList.add("hide");

      answer.classList.add("show");

    });


    /* NO BUTTON RUNS AWAY */

    noButton.addEventListener("mouseover", function() {

      const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        20;

      const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        20;

      const randomX =
        Math.max(10, Math.random() * maxX);

      const randomY =
        Math.max(10, Math.random() * maxY);

      noButton.style.position = "fixed";

      noButton.style.left =
        randomX + "px";

      noButton.style.top =
        randomY + "px";

    });


    /* NO BUTTON */

    noButton.addEventListener("click", function() {

      alert("Nice try 😭");

    });

  </script>

</body>
</html>
